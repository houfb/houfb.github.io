<script>
    setTimeout(async () => {
        let fp = new URLSearchParams(window.location.search).get('fp');
        if (!fp) { fp = 'default.md'; }
        if (fp.match(/(https?|file|ftp)\:\/\//i)) { return; }
        let res = await fetch(fp);
        let vs = await res.text();
        vs = vs ? marked.decode(vs) : '';
        if (vs) document.body.innerHTML = vs;
    }, 1000);
